name: storyweaver

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyweaver}
      POSTGRES_USER: ${POSTGRES_USER:-storyweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyweaver}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-storyweaver} -d ${POSTGRES_DB:-storyweaver}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-storyweaver}
      DB_USERNAME: ${POSTGRES_USER:-storyweaver}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-storyweaver}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_USER_ID_SECRET: ${DEEPSEEK_USER_ID_SECRET:-local-development-deepseek-user-id-secret-2026}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_MODEL_URI: ${EMBEDDING_MODEL_URI:-file:/models/model.onnx}
      EMBEDDING_TOKENIZER_URI: ${EMBEDDING_TOKENIZER_URI:-file:/models/tokenizer.json}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      EMBEDDING_CACHE_DIRECTORY: /tmp/storyweaver-onnx-cache
      WORKFLOW_STALE_RUN_TIMEOUT: ${WORKFLOW_STALE_RUN_TIMEOUT:-15m}
      WORKFLOW_HEARTBEAT_INTERVAL: ${WORKFLOW_HEARTBEAT_INTERVAL:-15s}
      WORKFLOW_RECOVERY_INTERVAL: ${WORKFLOW_RECOVERY_INTERVAL:-30s}
      WORKFLOW_CONTEXT_TTL: ${WORKFLOW_CONTEXT_TTL:-30m}
      WORKFLOW_EVENT_STREAM_TIMEOUT: ${WORKFLOW_EVENT_STREAM_TIMEOUT:-5m}
      WORKFLOW_EVENT_POLL_INTERVAL: ${WORKFLOW_EVENT_POLL_INTERVAL:-250ms}
      WORKFLOW_MAX_ACTIVE_RUNS_PER_PROJECT: ${WORKFLOW_MAX_ACTIVE_RUNS_PER_PROJECT:-1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      BUDGET_TASK_TOKEN_LIMIT: ${BUDGET_TASK_TOKEN_LIMIT:-40000}
      BUDGET_USER_DAILY_COST_LIMIT: ${BUDGET_USER_DAILY_COST_LIMIT:-100.00000000}
      BUDGET_PROJECT_COST_LIMIT: ${BUDGET_PROJECT_COST_LIMIT:-1000.00000000}
      BUDGET_WRITER_OUTPUT_TOKEN_LIMIT: ${BUDGET_WRITER_OUTPUT_TOKEN_LIMIT:-12000}
      BUDGET_PLANNER_REASONING_TOKEN_LIMIT: ${BUDGET_PLANNER_REASONING_TOKEN_LIMIT:-6000}
      TXT_IMPORT_STORAGE_DIRECTORY: /data/imports
      TXT_IMPORT_SOURCE_RETENTION: ${TXT_IMPORT_SOURCE_RETENTION:-24h}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
      - import_sources:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  import_sources:

networks:
  backend:
    driver: bridge
