spring:
  application:
    name: storyweaver-backend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      timeout: 3s
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2MB
  ai:
    model:
      chat: none
      embedding: none
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        type: SYNC
        name: storyweaver-mcp
        version: 1.5.0
        instructions: Read StoryWeaver project state and create evidence-backed candidate facts only.
        capabilities:
          completion: false
        stateless:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false

info:
  application:
    name: ${spring.application.name}
    phase: 1.5
    description: StoryWeaver V1.5 long-form production with import, rolling outline, gates, branches and model fallback

storyweaver:
  security:
    jwt:
      issuer: storyweaver
      secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
      ttl: 8h
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    user-id-secret: ${DEEPSEEK_USER_ID_SECRET:${JWT_SECRET:local-development-secret-change-before-production-2026}}
    connect-timeout: 10s
    retry-initial-backoff: 1s
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model-name: BAAI/bge-small-zh-v1.5
    dimensions: ${EMBEDDING_DIMENSIONS:512}
    model-uri: ${EMBEDDING_MODEL_URI:file:/models/model.onnx}
    tokenizer-uri: ${EMBEDDING_TOKENIZER_URI:file:/models/tokenizer.json}
    cache-directory: ${EMBEDDING_CACHE_DIRECTORY:/tmp/storyweaver-onnx-cache}
  retrieval:
    worldbook-default-token-budget: 4000
    worldbook-default-top-k: 8
    worldbook-mode: VECTOR_ONLY
    worldbook-candidate-pool-size: 10
    worldbook-final-ranking-size: 2147483647
    worldbook-rrf-rank-constant: 60
    event-default-top-k: 10
    semantic-weight: 0.50
    participant-weight: 0.20
    location-weight: 0.10
    chapter-proximity-weight: 0.10
    importance-weight: 0.10
  workflow:
    stale-run-timeout: ${WORKFLOW_STALE_RUN_TIMEOUT:15m}
    heartbeat-interval: ${WORKFLOW_HEARTBEAT_INTERVAL:15s}
    recovery-interval: ${WORKFLOW_RECOVERY_INTERVAL:30s}
    context-ttl: ${WORKFLOW_CONTEXT_TTL:30m}
    event-stream-timeout: ${WORKFLOW_EVENT_STREAM_TIMEOUT:5m}
    event-poll-interval: ${WORKFLOW_EVENT_POLL_INTERVAL:250ms}
    max-active-runs-per-project: ${WORKFLOW_MAX_ACTIVE_RUNS_PER_PROJECT:1}
  budget:
    default-task-token-limit: ${BUDGET_TASK_TOKEN_LIMIT:40000}
    default-user-daily-cost-limit: ${BUDGET_USER_DAILY_COST_LIMIT:100.00000000}
    default-project-cost-limit: ${BUDGET_PROJECT_COST_LIMIT:1000.00000000}
    default-writer-output-token-limit: ${BUDGET_WRITER_OUTPUT_TOKEN_LIMIT:12000}
    default-planner-reasoning-token-limit: ${BUDGET_PLANNER_REASONING_TOKEN_LIMIT:6000}
  skill-forge:
    max-files: ${SKILL_FORGE_MAX_FILES:20}
    max-file-bytes: ${SKILL_FORGE_MAX_FILE_BYTES:10485760}
    max-total-bytes: ${SKILL_FORGE_MAX_TOTAL_BYTES:20971520}
    max-manual-characters: ${SKILL_FORGE_MAX_MANUAL_CHARACTERS:50000}
    min-manual-characters: ${SKILL_FORGE_MIN_MANUAL_CHARACTERS:200}
  import:
    txt:
      max-file-size: ${TXT_IMPORT_MAX_FILE_SIZE:20MB}
      storage-directory: ${TXT_IMPORT_STORAGE_DIRECTORY:./data/imports}
      source-retention: ${TXT_IMPORT_SOURCE_RETENTION:24h}
      cleanup-interval: ${TXT_IMPORT_CLEANUP_INTERVAL:1h}
      preview-max-characters: ${TXT_IMPORT_PREVIEW_MAX_CHARACTERS:5000}
      parser-max-heading-characters: ${TXT_IMPORT_MAX_HEADING_CHARACTERS:120}
      analysis-chunk-characters: ${TXT_IMPORT_ANALYSIS_CHUNK_CHARACTERS:12000}

server:
  shutdown: graceful
  forward-headers-strategy: framework

spring.lifecycle.timeout-per-shutdown-phase: 30s
