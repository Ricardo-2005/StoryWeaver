spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/storyweaver}
    username: ${DB_USERNAME:storyweaver}
    password: ${DB_PASSWORD:storyweaver}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  structured:
    format:
      console: logstash
