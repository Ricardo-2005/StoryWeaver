name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Maven project
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Phase 8 evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-evaluation-${{ github.run_id }}
          path: backend/target/phase8-results/phase8-results.json
          if-no-files-found: error

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag storyweaver-backend:${{ github.sha }} .
